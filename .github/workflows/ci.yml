name: CI

on:
  push:
    branches: [ main, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (review-comment-gate re-trigger)"
        required: false
        type: string
      head_sha:
        description: "Exact head SHA to evaluate against (review-comment-gate re-trigger)"
        required: false
        type: string
      gate:
        description: "Optional gate to re-run; leave empty to run all"
        required: false
        type: string
        default: ""

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Round-9 follow-up: gate-only workflow_dispatch dispatches
    # must NOT run this job. The operator-facing dispatch path is
    # ``aed_pr gate-recheck --head-sha <sha>`` which sets
    # ``gate=review-comment-gate``. The other three ordinary jobs
    # (validator, governance-validators, pr-gate-live-smoke)
    # carry the same guard. ``review-comment-gate`` runs on the
    # full pull_request path AND on workflow_dispatch regardless
    # of the gate input.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.gate != 'review-comment-gate'
    runs-on: ubuntu-latest
    env:
      HERMES_HOME: /tmp/aed-hermes-home
    strategy:
      matrix:
        python: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest coverage

      - name: Create Hermes home for PMG snapshot
        run: mkdir -p "$HERMES_HOME"

      - name: Run tests with coverage
        run: |
          coverage run --source=engine -m pytest -q
          coverage xml -o coverage.xml || true
          coverage html -d coverage_html || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage_html
          path: coverage_html

      - name: Upload junit/coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage_xml
          path: coverage.xml

      - name: Gather eval corpus test artifacts
        if: always()
        run: |
          set -e
          mkdir -p /tmp/test_eval_artifacts
          # Find eval_out dirs in pytest temp dirs and copy them
          find /tmp/pytest-of-runner -maxdepth 3 -name "eval_out" -type d 2>/dev/null | while read dir; do
            parent=$(basename "$(dirname "$dir")")
            cp -r "$dir" "/tmp/test_eval_artifacts/${parent}_eval_out" 2>/dev/null && echo "Copied: $dir" || echo "Skipped: $dir"
          done
          echo "=== Eval artifact summary ==="
          find /tmp/test_eval_artifacts -type f 2>/dev/null || echo "(no files found)"
          echo "=== End ==="

      - name: Upload eval corpus test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_eval_artifacts
          path: /tmp/test_eval_artifacts

  validator:
    # Round-9 follow-up: gate-only dispatch guard (see ``test``).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.gate != 'review-comment-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run Event/Options validator checks
        run: bash scripts/ci/validate_event_options_contract.sh

  governance-validators:
    # Round-9 follow-up: gate-only dispatch guard (see ``test``).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.gate != 'review-comment-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run governance manifests validator checks
        run: bash scripts/ci/validate_governance_manifests.sh

  review-comment-gate:
    # Round-3 fix: this gate runs on pull_request events AND on
    # workflow_dispatch. The dispatch path is the minimal mechanism
    # that lets the operator (or ``aed_pr gate-recheck``) re-evaluate
    # the gate against the exact head AFTER a new Codex response
    # arrives. INCONCLUSIVE never counts as success on either path;
    # the underlying script exits with the correct code (0/1/2)
    # and the step is failed when the script returns non-zero.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.gate == '' || inputs.gate == 'review-comment-gate'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run review-comment gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Refuse to run if the required inputs are missing; this
          # prevents the gate from silently running on an empty
          # head SHA, which would let the operator mask INCONCLUSIVE
          # as success.
          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::review-comment-gate requires PR_NUMBER and HEAD_SHA"
            exit 2
          fi
          mkdir -p /tmp/review_comment_gate
          python scripts/local/check_pr_review_comments.py \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --reported-head-sha "$HEAD_SHA" \
            --output-json /tmp/review_comment_gate/status.json \
            --output-md /tmp/review_comment_gate/status.md
          echo "=== REVIEW COMMENT GATE OUTPUT ==="
          cat /tmp/review_comment_gate/status.json
          echo ""
          # Exit code 0 = CLEAN, 1 = BLOCKED, 2 = INCONCLUSIVE.
          # The script itself exits with the correct code; do NOT
          # mask a non-zero exit code as success. INCONCLUSIVE (2)
          # fails the gate.

      - name: Upload gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-comment-gate-report
          path: /tmp/review_comment_gate/

  pr-gate-live-smoke:
    # Round-9 follow-up: gate-only dispatch guard (see ``test``).
    # ``needs: [test]`` is preserved because the smoke harness
    # depends on the test job having produced its coverage
    # artifact on the full pull_request path. When ``test`` is
    # skipped on a gate-only dispatch, GitHub Actions treats
    # this job's unmet dependency as a failure; the explicit
    # ``if: skip`` makes the skip visible in the run summary.
    needs: [test]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.gate != 'review-comment-gate')
    runs-on: ubuntu-latest
    # Runs on all PRs to main (pull_request trigger is broad).
    # The smoke harness is read-only (no kanban create, no dispatch,
    # no merge, no external side-effects).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run PR gate live smoke harness
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr_gate_live_smoke_ci
          python scripts/local/pr_gate_controller_live_smoke.py \
            --repo-owner "$REPO_OWNER" \
            --repo-name "$REPO_NAME" \
            --board aed \
            --output-dir /tmp/pr_gate_live_smoke_ci
          echo "=== SMOKE REPORT ==="
          cat /tmp/pr_gate_live_smoke_ci/PR_GATE_CONTROLLER_LIVE_SMOKE_REPORT.json || true
          echo ""
          echo "=== SMOKE MARKDOWN ==="
          cat /tmp/pr_gate_live_smoke_ci/PR_GATE_CONTROLLER_LIVE_SMOKE_REPORT.md || true
          # Fail job if smoke did not pass
          python .github/workflows/ci_check_smoke.py /tmp/pr_gate_live_smoke_ci

      - name: Upload smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-live-smoke-report
          path: /tmp/pr_gate_live_smoke_ci/PR_GATE_CONTROLLER_LIVE_SMOKE_REPORT.*