# Autocoder supervisor — minimal install metadata.
#
# This manifest lets `pip install /opt/aed-supervisor` work
# without needing to fall back to the repository-level
# pyproject.toml.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aed-supervisor"
version = "1.0.0"
description = "AED Autocoder Supervisor (source-controlled)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["autocoder_supervisor*"]
